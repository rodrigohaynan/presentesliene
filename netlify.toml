[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# URL limpa e estável para a miniatura social.
# O Netlify Image CDN converte a arte WEBP local para JPEG 1200x630.
[[redirects]]
  from = "/liene-whatsapp.jpg"
  to = "/.netlify/images?url=/images/liene-31.webp&w=1200&h=630&fit=cover&position=center&fm=jpg&q=82"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/organizador"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"
